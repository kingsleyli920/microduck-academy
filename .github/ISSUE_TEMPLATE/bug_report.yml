name: Bug report
description: Report a reproducible classroom or simulator problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Microduck Academy. Do not include secrets or private learning profiles.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the lesson or lab level and the behavior you saw.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Run…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node.js 22, Chrome 140
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
